kind: Composition
apiVersion: apiextensions.crossplane.io/v1
metadata:
  name: xpostgres-pipeline.demo.crossplane-assistant.io
spec:
  compositeTypeRef:
    apiVersion: demo.crossplane-assistant.io/v1alpha1
    kind: XPostgreSQLInstance
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: DbSubnetGroup
            base:
              apiVersion: database.aws.upbound.io/v1beta1
              kind: DBSubnetGroup
              spec:
                forProvider:
                  description: "Database subnet group"
            patches:
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.atProvider.dbSubnetGroupId
          - name: RDSInstance
            base:
              apiVersion: database.aws.upbound.io/v1beta1
              kind: RDSInstance
              spec:
                forProvider:
                  dbSubnetGroupName: "placeholder"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.atProvider.dbSubnetGroupId
                toFieldPath: spec.forProvider.dbSubnetGroupName
