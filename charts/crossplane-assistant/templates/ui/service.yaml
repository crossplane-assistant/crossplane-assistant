apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossplane-assistant.ui.fullname" . }}
  labels:
    {{- include "crossplane-assistant.ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "crossplane-assistant.selectorLabels" (dict "context" . "name" .Values.ui.name) | nindent 4 }}
