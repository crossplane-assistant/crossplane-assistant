apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossplane-assistant.api.fullname" . }}
  labels:
    {{- include "crossplane-assistant.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "crossplane-assistant.selectorLabels" (dict "context" . "name" .Values.api.name) | nindent 4 }}
