apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crossplane-assistant.api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "crossplane-assistant.labels" (dict "context" . "name" .Values.api.name)  | nindent 4 }}
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['get', 'list', 'watch']
