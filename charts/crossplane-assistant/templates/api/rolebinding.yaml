{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crossplane-assistant.api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "crossplane-assistant.labels" (dict "context" . "component" .Values.api.name "name" .Values.api.name) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crossplane-assistant.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "crossplane-assistant.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
