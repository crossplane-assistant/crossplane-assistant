<div class="drawer" [class.slidein]="visible">
  <div (click)="closeDrawer()" class="background"></div>

  <div class="content">
    <div class="header">
        <ng-content select="panel-title"></ng-content>
         <a (click)="closeDrawer()" class="close" title="Close panel"></a>
    </div>

    <ng-content></ng-content>
  </div>
</div>
