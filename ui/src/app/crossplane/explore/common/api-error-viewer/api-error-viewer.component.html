@if(err){
<div class="msg-err" style="white-space: pre-wrap;">

    @if(err.error){

        <div class="title">
            <span class="material-symbols-outlined">cancel</span>
            {{err.error?.ErrStatus?.reason}}
        </div>
        <p>
            {{err.error?.ErrStatus?.message}}
        </p>

        <div class="detail">
            {{err.error | json}}
        </div>
    }@else{
        <div class="detail">
            {{err | json}}
        </div>
    }
</div>
}
