@if (!events || events.length == 0) {
  No event
} @else {
  <div>
    <div class="event {{ event.type }}" *ngFor="let event of events">
      <div class="sm-2">{{ event.reason }}</div>
      <div class="sm-4">{{ event.message }}</div>
      <div class="sm-2">
        @if (event.count) {
          {{ event.count }}
        } @else {
          1
        }
      </div>
      <div class="sm-2">{{ event.eventTime | date: 'medium' }}</div>
    </div>
  </div>
}
